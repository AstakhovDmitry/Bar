name: Keep Supabase Active

# Supabase «засинає» (pause) на безкоштовному плані після ~7 днів без
# реальних запитів до бази. Цей workflow двічі на тиждень робить справжній
# SELECT-запит через REST API Supabase, а також комітить позначку часу —
# щоб GitHub сам не вимкнув розклад через 60 днів без активності в репозиторії.

on:
  schedule:
    - cron: '0 8 * * 1,4'   # понеділок і четвер, 08:00 UTC
  workflow_dispatch: {}       # можливість запустити вручну з вкладки Actions

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Пінг Supabase (реальний запит до бази)
        env:
          # Це публічний anon-ключ — він і так відкрито лежить у js/supabaseClient.js,
          # тож секретність тут не потрібна (реальний захист даних — RLS у Supabase).
          SUPABASE_URL: https://gigmaayxbuxfzfmuqxfl.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdpZ21hYXl4YnV4ZnpmbXVxeGZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2OTE5MzIsImV4cCI6MjA5OTI2NzkzMn0.QTHbDaq9LRLFg_HtZpOXSp3zyk_YyKah6SNEI9KhB8E
        run: |
          curl -sS "$SUPABASE_URL/rest/v1/cocktails?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -o /dev/null -w "HTTP-статус: %{http_code}\n" -f

      - name: Позначка часу (щоб репозиторій не «затих» для GitHub)
        run: |
          mkdir -p .keepalive
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive/last-ping.txt

      - name: Закомітити, якщо є зміни
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .keepalive/last-ping.txt
          git diff --quiet --cached || git commit -m "chore: keepalive ping $(date -u +%Y-%m-%d)"
          git push
