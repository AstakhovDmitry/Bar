<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Коктейльна карта</title>
<meta name="description" content="102 класичні рецепти IBA і те, що можна змішати просто зараз.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23c9a35c' stroke-width='1.5' stroke-linecap='round'%3E%3Cpath d='M4.5 5.5h15c0 3.9-3.2 6.3-7.5 6.3S4.5 9.4 4.5 5.5Z'/%3E%3Cpath d='M12 11.8V19M8.5 21h7'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Forum&family=Oswald:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a class="wordmark" href="index.html"><span class="gem"></span>Коктейльна карта</a>
    <nav class="site-nav" aria-label="Основна навігація">
      <a class="nav-link" href="inventory.html" id="nav-inventory" hidden>Інвентар</a>
      <span id="auth-area"></span>
    </nav>
  </div>
</header>

<!-- ══ Коктейльна карта ══════════════════════════════════════════════ -->
<main id="collection" class="collection">

  <div class="section-head">
    <span class="eyebrow">Барна книга · IBA</span>
    <h1>Коктейльна карта</h1>
    <div class="deco-divider" aria-hidden="true"><span class="gem"></span></div>
  </div>

  <!-- Панель керування: статус · категорії · непомітні розширені фільтри -->
  <div class="toolbar" id="toolbar">
    <div class="toolbar-inner">
      <div class="status-tabs" role="tablist" aria-label="Доступність">
        <button class="status-tab active" role="tab" aria-selected="true" data-status="ready" type="button">
          Можна зараз <span class="tab-count" id="count-ready"></span>
        </button>
        <button class="status-tab" role="tab" aria-selected="false" data-status="almost" type="button">
          Майже <span class="tab-count" id="count-almost"></span>
        </button>
        <button class="status-tab" role="tab" aria-selected="false" data-status="all" type="button">
          Вся колекція <span class="tab-count" id="count-all"></span>
        </button>
      </div>

      <button class="icon-btn adv-toggle" id="adv-toggle" type="button"
              aria-expanded="false" aria-controls="adv-panel" title="Розширені фільтри">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 7.5h8M17.5 7.5H20M4 16.5h2.5M12 16.5h8"/><circle cx="14.5" cy="7.5" r="2.3"/><circle cx="9.5" cy="16.5" r="2.3"/></svg>
        <span class="adv-dot" id="adv-dot" hidden></span>
      </button>
    </div>

    <div class="category-row" id="category-row" aria-label="Смакові категорії"></div>

    <!-- Прихована шухляда розширених фільтрів -->
    <div class="adv-panel" id="adv-panel" hidden>
      <div class="adv-grid">
        <label class="adv-field adv-search">
          <span class="adv-label">Пошук за назвою</span>
          <div class="input-wrap">
            <svg class="input-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="11" cy="11" r="6.3"/><path d="M15.7 15.7 21 21"/></svg>
            <input type="search" id="search-input" placeholder="Негроні, sour, фіз…" autocomplete="off">
          </div>
        </label>

        <label class="adv-field">
          <span class="adv-label">Епоха IBA</span>
          <select id="filter-iba">
            <option value="">Усі епохи</option>
            <option value="Unforgettable">Незабутні</option>
            <option value="ContemporaryClassic">Сучасна класика</option>
            <option value="NewEra">Нова ера</option>
          </select>
        </label>

        <label class="adv-field">
          <span class="adv-label">Інгредієнт</span>
          <select id="filter-ingredient">
            <option value="">Будь-який інгредієнт</option>
          </select>
        </label>

        <button class="btn btn-quiet adv-reset" id="adv-reset" type="button">Скинути</button>
      </div>
    </div>
  </div>

  <div class="result-line">
    <span id="result-count"></span>
    <button class="link-reset" id="clear-filters-btn" type="button" hidden>скинути фільтри</button>
  </div>

  <!-- Сітка карток -->
  <div class="deck" id="cocktail-grid" aria-live="polite"></div>

  <!-- Порожній стан / помилка -->
  <div class="state-panel" id="empty-state" hidden></div>
</main>

<!-- ══ Оверлей: рецептурна картка коктейлю ═══════════════════════════ -->
<div class="sheet-overlay" id="cocktail-sheet" aria-hidden="true">
  <article class="sheet" role="dialog" aria-modal="true" aria-label="Деталі коктейлю">
    <button class="modal-close sheet-close" id="sheet-close-btn" type="button" aria-label="Закрити">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
    </button>
    <div class="sheet-media" id="sheet-media"></div>
    <div class="sheet-content" id="sheet-content"></div>
  </article>
</div>

<!-- ══ Модалка входу власника ════════════════════════════════════════ -->
<div class="modal-overlay" id="signin-modal" aria-hidden="true">
  <div class="modal signin-card" role="dialog" aria-modal="true" aria-label="Вхід для власника">
    <button class="modal-close" id="signin-close-btn" type="button" aria-label="Закрити">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
    </button>
    <div class="signin-body">
      <span class="eyebrow">Коктейльна карта</span>
      <h3>Вхід для власника</h3>
      <form id="signin-form">
        <div class="form-field">
          <label for="signin-email">Email</label>
          <input type="email" id="signin-email" required autocomplete="username">
        </div>
        <div class="form-field">
          <label for="signin-password">Пароль</label>
          <input type="password" id="signin-password" required autocomplete="current-password">
        </div>
        <div class="form-error" id="signin-error" role="alert"></div>
        <button type="submit" class="btn btn-gold" style="width:100%;">Увійти</button>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/ui.js"></script>
<script src="js/catalog.js"></script>
</body>
</html>
